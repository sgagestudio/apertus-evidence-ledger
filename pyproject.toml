[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apertus-evidence-ledger"
version = "0.1.0"
description = "Local-first evidence-grounded assistant for Apertus 1.5"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "sgagestudio" }]
dependencies = []

[project.scripts]
apertus-evidence = "apertus_evidence.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
